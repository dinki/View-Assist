type: custom:button-card
template:
  - variable_template
  - status_icons_content
  - responsive_base
show_state: false
show_icon: false
show_name: false
variables:
  slideshowcardversion: 1.0.0
  var_background: >-
    [[[ try {if (hass.states[variables.var_assistsat_entity] &&
    hass.states[variables.var_assistsat_entity].attributes.mode === "night")
    return ""; else return hass.states[variables.var_assistsat_entity] ?
    hass.states[variables.var_assistsat_entity].attributes.background : ""}
    catch {return ""}]]]
  var_show_details: >-
    [[[ try {return hass.states[variables.var_assistsat_entity].attributes.show_details === true;} catch {return false;} ]]]
  var_photo_date: >-
    [[[
      try {
        const bg = hass.states[variables.var_assistsat_entity]?.attributes?.background || "";
        const match = bg.match(/camera\.([a-zA-Z0-9_]+)/);
        const camEntity = match ? `camera.${match[1]}` : "camera.album_slideshow";
        const camState = hass.states[camEntity];
        if (camState && camState.attributes) {
          const dt = camState.attributes.captured_at_primary || (Array.isArray(camState.attributes.captured_at) ? camState.attributes.captured_at[0] : camState.attributes.captured_at);
          if (dt) {
            const d = new Date(dt);
            return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
          }
        }
        return "";
      } catch {
        return "";
      }
    ]]]
  var_photo_location: >-
    [[[
      try {
        const bg = hass.states[variables.var_assistsat_entity]?.attributes?.background || "";
        const match = bg.match(/camera\.([a-zA-Z0-9_]+)/);
        const camEntity = match ? `camera.${match[1]}` : "camera.album_slideshow";
        const camState = hass.states[camEntity];
        return camState?.attributes?.location || "";
      } catch {
        return "";
      }
    ]]]
  var_pause_switch: >-
    [[[
      try {
        const bg = hass.states[variables.var_assistsat_entity]?.attributes?.background || "";
        const match = bg.match(/camera\.([a-zA-Z0-9_]+)/);
        const switchEntity = match ? `switch.${match[1]}_pause_slideshow` : "switch.album_slideshow_pause_slideshow";
        if (switchEntity in hass.states) return switchEntity;
        const keys = Object.keys(hass.states).filter(k => k.startsWith('switch.') && k.endsWith('_pause_slideshow'));
        if (keys.length > 0) return keys[0];
        return "";
      } catch {
        return "";
      }
    ]]]
tap_action:
  action: >-
    [[[ return variables.var_pause_switch ? "call-service" : "none"; ]]]
  service: switch.toggle
  service_data:
    entity_id: "[[[ return variables.var_pause_switch; ]]]"
double_tap_action:
  action: >-
    [[[ return variables.var_pause_switch ? "call-service" : "none"; ]]]
  service: switch.turn_off
  service_data:
    entity_id: "[[[ return variables.var_pause_switch; ]]]"
hold_action:
  action: call-service
  service: switch.toggle
  service_data:
    entity_id: "[[[ try { return variables.var_mic_switch; } catch { return ''; } ]]]"
styles:
  grid:
    - grid-template-areas: |
        "title status"
        "details details"
        "assist assist"
    - grid-template-rows: min-content 1fr min-content
    - grid-template-columns: 1fr 1fr
  card:
    - background: >-
        [[[ return `center / cover no-repeat url(${variables.var_background})` ]]]
    - background-size: cover
    - background-color: black
    - position: relative
  custom_fields:
    title:
      - display: none
    status:
      - position: absolute
      - justify-self: end
      - align-self: end
      - justify-content: right
      - top: 0vh
      - right: 0vw
      - z-index: 2
    details:
      - position: absolute
      - bottom: 3vh
      - justify-self: center
      - align-self: end
      - z-index: 2
      - display: >-
          [[[ return variables.var_show_details ? "block" : "none"; ]]]
    pause_indicator:
      - position: absolute
      - top: 2vh
      - right: 2vw
      - z-index: 2
      - display: >-
          [[[
            if (variables.var_pause_switch && hass.states[variables.var_pause_switch]) {
              return hass.states[variables.var_pause_switch].state === "on" ? "block" : "none";
            }
            return "none";
          ]]]
custom_fields:
  title: ""
  message: ""
  details:
    card:
      type: custom:button-card
      show_name: true
      show_icon: true
      icon: mdi:calendar-blank-outline
      name: >-
        [[[ return variables.var_photo_location ? `${variables.var_photo_date} • ${variables.var_photo_location}` : variables.var_photo_date; ]]]
      styles:
        card:
          - background-color: rgba(0, 0, 0, 0.65)
          - backdrop-filter: blur(12px)
          - (-webkit-backdrop-filter): blur(12px)
          - border-radius: 24px
          - padding: 8px 20px
          - border: 1px solid rgba(255, 255, 255, 0.2)
          - box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37)
        name:
          - font-size: 1.8vw
          - font-weight: 500
          - color: "#ffffff"
          - padding-left: 8px
        icon:
          - color: "#ffffff"
          - width: 1.8vw
        grid:
          - grid-template-areas: "\"i n\""
  pause_indicator:
    card:
      type: custom:button-card
      icon: mdi:pause
      show_name: false
      tap_action:
        action: call-service
        service: switch.turn_off
        service_data:
          entity_id: "[[[ return variables.var_pause_switch; ]]]"
      styles:
        card:
          - background-color: rgba(0, 0, 0, 0.5)
          - backdrop-filter: blur(8px)
          - (-webkit-backdrop-filter): blur(8px)
          - border-radius: 50%
          - width: 3.2rem
          - height: 3.2rem
          - padding: 0px
          - border: 1px solid rgba(255, 255, 255, 0.25)
        icon:
          - color: "#ffffff"
          - width: 1.8rem
          - height: 1.8rem
