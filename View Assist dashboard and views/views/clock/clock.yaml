type: custom:button-card
variables:
  clockcardversion: 1.6.0
  var_clock_style: >-
    [[[ try {return
    hass.states[variables.var_assistsat_entity].attributes.clock_style ||
    "standard"} catch {return "standard"} ]]]
  var_background: >-
    [[[ try {return
    hass.states[variables.var_assistsat_entity].attributes.background} catch
    {return ""} ]]]
template:
  - variable_template
show_icon: false
show_name: false
show_state: false
show_label: false
styles:
  card:
    - background: none
    - background-color: transparent
    - border-width: 0px
    - padding: 0px
    - overflow: visible
  grid:
    - grid-template-columns: 1fr
    - grid-template-rows: 1fr
  custom_fields:
    standard_layout:
      - position: absolute
      - top: 0px
      - left: 0px
      - width: 100%
      - height: 100%
      - display: >-
          [[[ return variables.var_clock_style === "alternate" ? "none" :
          "block" ]]]
    alternate_layout:
      - position: absolute
      - top: 0px
      - left: 0px
      - width: 100%
      - height: 100%
      - display: >-
          [[[ return variables.var_clock_style === "alternate" ? "block" :
          "none" ]]]
custom_fields:
  standard_layout:
    card:
      type: custom:button-card
      variables:
        clockcardversion: 1.6.0
        var_font_color: >-
          [[[ try {if (hass.states[variables.var_assistsat_entity] &&
          hass.states[variables.var_assistsat_entity].attributes.mode ===
          "night") return "red"; else return "white";} catch {return "white";}
          ]]]
        var_font_color_night: >-
          [[[ try {if (hass.states[variables.var_assistsat_entity] &&
          hass.states[variables.var_assistsat_entity].attributes.mode ===
          "night") return "transparent"; else return "white";} catch {return
          "white";} ]]]
      template:
        - variable_template
        - responsive_base
        - body_template
      styles:
        grid:
          - grid-template-areas: |
              "title status"
              "time time"
              "date date"
          - grid-template-rows: |-
              [[[
                if (window.viewAssistResponsive && window.viewAssistResponsive.orientation === "portrait") {
                  return "15vh 35vh 15vh";
                } else {
                  return "15vh 50vh 15vh";
                }
              ]]]
          - grid-template-columns: 1fr 1fr
        card:
          - background-image: '[[[ return "url(" + variables.var_background + ")" ]]]'
          - background-position: center
          - background-size: cover
          - background-repeat: no-repeat
          - background-color: black
          - position: relative
        custom_fields:
          title:
            - display: grid
            - color: "[[[ return variables.var_font_color_night ]]]"
          time:
            - display: grid
            - justify-self: center
            - align-self: center
            - z-index: 1
            - font-size: |-
                [[[
                  if (window.viewAssistResponsive && window.viewAssistResponsive.orientation === "portrait") {
                    return "25vh";
                  } else {
                    return "55vh";
                  }
                ]]]
            - font-weight: bold
            - opacity: >-
                [[[ try {if (hass.states[variables.var_assistsat_entity] &&
                hass.states[variables.var_assistsat_entity].attributes.mode ===
                "night") return "35%"; else return "100%";} catch {return
                "100%";} ]]]
            - color: "[[[ return variables.var_font_color ]]]"
            - padding-top: 0
            - margin-top: 0
          date:
            - display: grid
            - justify-self: center
            - align-self: center
            - z-index: 1
            - font-size: |-
                [[[
                  if (window.viewAssistResponsive && window.viewAssistResponsive.orientation === "portrait") {
                    return "8vh";
                  } else {
                    return "15vh";
                  }
                ]]]
            - width: max-content
            - color: "[[[ return variables.var_font_color_night ]]]"
          night:
            - position: absolute
            - top: 0
            - min-height: 100%
            - width: 100%
            - overflow: hidden
            - display: >-
                [[[ try {if (hass.states[variables.var_assistsat_entity] &&
                hass.states[variables.var_assistsat_entity].attributes.mode ===
                "night") return "block"; else return "none";} catch { return
                "none"}
                 ]]]
            - z-index: 2
          shader:
            - position: absolute
            - top: 0
            - height: 100%
            - width: 100%
            - background-color: rgba(0,0,0,0.15)
      custom_fields:
        title:
          card:
            type: custom:button-card
            icon: "[[[ return variables.var_weather_icon ]]]"
            name: "[[[ return variables.var_weather_temperature ]]]"
            template: null
            tap_action:
              action: call-service
              service: view_assist.navigate
              service_data:
                device: "[[[ return variables.var_assistsat_entity ]]]"
                path: "[[[ return `${variables.var_dashboard}/weather` ]]]"
            styles:
              card:
                - background-color: transparent
                - border-width: 0px
                - width: 100%
                - top: -5%
                - left: 5%
              grid:
                - grid-template-areas: '"i n"'
              name:
                - font-size: |-
                    [[[
                      if (window.viewAssistResponsive && window.viewAssistResponsive.orientation === "portrait") {
                        return "10vh";
                      } else {
                        return "15vh";
                      }
                    ]]]
                - color: "[[[ return variables.var_font_color_night ]]]"
              icon:
                - width: |-
                    [[[
                      if (window.viewAssistResponsive && window.viewAssistResponsive.orientation === "portrait") {
                        return "10vh";
                      } else {
                        return "13vh";
                      }
                    ]]]
                - color: "[[[ return variables.var_font_color_night ]]]"
        time: "[[[ return variables.var_current_time ]]]"
        date: "[[[ return variables.var_date_short ]]]"
        night: ""
        shader: ""
  alternate_layout:
    card:
      type: custom:button-card
      template:
        - variable_template
        - body_template
      variables:
        clockaltcardversion: 1.0.0
      styles:
        card:
          - background-image: '[[[ return "url(" + variables.var_background + ")" ]]]'
          - background-position: center
          - background-size: cover
          - background-repeat: no-repeat
        grid:
          - grid-template-areas: |
              "title status"
              "clock clock"
              "assist assist"
          - grid-template-rows: min-content min-content min-content min-content
          - grid-template-columns: 1fr 1fr
        custom_fields:
          clock:
            - justify-self: start
            - align-self: center
            - font-size: 500%
            - width: max-content
            - position: absolute
            - top: 65%
      custom_fields:
        title: ""
        clock:
          card:
            type: horizontal-stack
            cards:
              - type: custom:button-card
                name: "[[[ return variables.var_current_time ]]]"
                styles:
                  name:
                    - font-size: 1000%
                    - text-shadow: 2px 2px black
                  card:
                    - background-color: transparent
                    - border-width: 0px
              - type: custom:button-card
                icon: "[[[ return variables.var_weather_icon ]]]"
                name: "[[[ return variables.var_weather_temperature ]]]"
                tap_action:
                  action: navigate
                  navigation_path: weather
                styles:
                  card:
                    - background-color: transparent
                    - border-width: 0px
                    - width: 50%
                    - position: relative
                    - bottom: -40%
                  grid:
                    - grid-template-areas: '"i n"'
                    - grid-template-rows: min-content min-content
                  name:
                    - font-size: 400%
                    - text-shadow: 2px 2px black
                  icon:
                    - width: 80%
                    - filter: drop-shadow(2px 2px black)
