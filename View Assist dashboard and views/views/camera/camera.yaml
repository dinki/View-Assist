type: custom:button-card
variables:
  camerascardversion: 2.2.0
  var_cameras_attribute: cameras
  var_cameras: |-
    [[[
      const isAvailable = (entityId) => {
        const entity = hass.states[entityId];
        return entity && entity.state !== 'unavailable' && entity.state !== 'unknown';
      };

      let value;
      try {
        value = states[variables.var_assistsat_entity].attributes[variables.var_cameras_attribute];
      } catch {
        value = undefined;
      }

      let requested = [];
      if (Array.isArray(value)) {
        requested = value;
      } else if (typeof value === 'string') {
        requested = value.replace(/[\[\]'"]/g, '').split(',');
      }
      requested = requested.map(id => String(id).trim()).filter(id => id.startsWith('camera.'));

      if (requested.length > 0) {
        return requested;
      }

      return Object.keys(hass.states)
        .filter(id => id.startsWith('camera.') && isAvailable(id))
        .sort((a, b) => {
          const nameA = hass.states[a].attributes.friendly_name || a;
          const nameB = hass.states[b].attributes.friendly_name || b;
          return nameA.localeCompare(nameB);
        });
    ]]]
template:
  - variable_template
  - responsive_base
  - body_template
styles:
  grid:
    - grid-template-areas: |
        "status status"
        "camera camera"
    - grid-template-columns: 1fr 1fr
    - grid-template-rows: min-content 1fr
  card:
    - background-color: "#000000"
    - border-radius: 0px
    - overflow: hidden
  custom_fields:
    camera:
      - position: absolute
      - top: 0
      - left: 0
      - width: 100%
      - height: 100%
      - z-index: 0
    back_button:
      - position: absolute
      - left: .41rem
      - top: .41rem
      - z-index: 2
custom_fields:
  title: ""
  back_button:
    card:
      type: custom:button-card
      icon: mdi:arrow-left-bold
      show_name: false
      styles:
        card:
          - background: rgba(0,0,0,0.6)
          - border-radius: 50%
          - width: 2.75rem
          - height: 2.75rem
          - padding: 0
        icon:
          - color: white
          - width: 1.5rem
          - height: 1.5rem
      grid:
        - grid-template-areas: i
        - justify-items: center
        - align-items: center
      tap_action:
        action: call-service
        service: view_assist.navigate
        service_data:
          device: "[[[ return variables.var_assistsat_entity ]]]"
          path: home
  camera:
    force_recreate: true
    card:
      type: custom:advanced-camera-card
      cameras: |-
        [[[
          return variables.var_cameras.map(entityId => ({
            camera_entity: entityId,
            dimensions: {
              aspect_ratio: '16:9',
              layout: { fit: 'cover' },
              grid: { width_factor: 1 }
            }
          }));
        ]]]
      live:
        display:
          grid_columns: |-
            [[[
              return Math.min(4, Math.max(1, Math.ceil(Math.sqrt(variables.var_cameras.length))));
            ]]]
          grid_max_columns: 4
          mode: grid
          grid_selected_width_factor: 1
          grid_selected_position: default
